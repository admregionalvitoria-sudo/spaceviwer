# SpaceViewer v3.2.1
appId: com.spaceviewer.app
productName: SpaceViewer
copyright: "© 2026 SpaceViewer"

publish:
  provider: github
  owner: admregionalvitoria-sudo
  repo: spaceviwer

directories:
  output: dist-package

extraResources:
  - from: resources/spaceviwerstream
    to: spaceviwerstream
    filter:
      - '**/*'
      - '!SpaceviwerStream.exe'
      - '!install-audio.ps1'
      - '!migrate-host.ps1'
      - '!driver/audio{,/**/*}'
  - from: resources/apk
    to: apk
    filter:
      - '*.apk'
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - 'ffmpeg.exe'
      - 'LICENSE.txt'
      - 'SOURCE.txt'

files:
  - out/**/*

win:
  icon: resources/icon.ico
  requestedExecutionLevel: requireAdministrator
  target:
    - target: nsis
      arch: [x64]
  artifactName: "SpaceViewer-Setup-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SpaceViewer
  include: resources/installer/installer.nsh

linux:
  icon: resources/icon.png
  target:
    - deb
    - AppImage
  category: Network
  description: Extended and mirrored displays on Android tablets and phones over the local network

protocols:
  - name: spaceviewer
    schemes:
      - spaceviewer
